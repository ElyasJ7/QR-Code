<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-Code – Ausbildungszeugnis</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 480px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            text-align: center;
            color: #1a1a1a;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #444; line-height: 1.5; }
        #qrcode {
            display: inline-block;
            margin: 1.5rem 0;
            padding: 1rem;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .url {
            font-size: 0.75rem;
            word-break: break-all;
            color: #666;
            background: #f5f5f5;
            padding: 0.75rem;
            border-radius: 6px;
        }
        .hint {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #888;
            text-align: left;
        }
        .hint strong { color: #c00; }
        a { color: #0066cc; }
    </style>
</head>
<body>
    <h1>Ausbildungszeugnis</h1>
    <p>QR-Code scannen, um das PDF zu öffnen:</p>

    <div id="qrcode"></div>

    <p class="url" id="pdf-url"></p>

    <p class="hint">
        <strong>Wichtig:</strong> Der QR-Code funktioniert nur, wenn die Dateien online erreichbar sind
        (z.&nbsp;B. GitHub Pages, Netlify, eigene Website). Lokal per Doppelklick öffnen reicht nicht.
        <br><br>
        <a href="/Zeugnisse/Ausbildungsszeugnis-Elyas Jebran-signed.pdf">Zur Zeugnisse-Seite</a>
    </p>

    <script>
        const pdfPath = "Zeugnisse/Ausbildungsszeugnis-Elyas%20Jebran-signed.pdf";
        const pdfUrl = new URL(pdfPath, window.location.href).href;

        document.getElementById("pdf-url").textContent = pdfUrl;

        new QRCode(document.getElementById("qrcode"), {
            text: pdfUrl,
            width: 256,
            height: 256,
            correctLevel: QRCode.CorrectLevel.M
        });
    </script>
</body>
</html>
