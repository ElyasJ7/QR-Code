<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-Code – IHK Zeugnis</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 480px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            text-align: center;
            color: #1a1a1a;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #444; line-height: 1.5; }
        #qrcode {
            display: inline-block;
            margin: 1.5rem 0;
            padding: 1rem;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .url {
            font-size: 0.75rem;
            word-break: break-all;
            color: #666;
            background: #f5f5f5;
            padding: 0.75rem;
            border-radius: 6px;
        }
        .hint {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #888;
            text-align: left;
        }
        .hint strong { color: #c00; }
        a { color: #0066cc; }
    </style>
</head>
<body>
    <h1>IHK Zeugnis</h1>
    <p>QR-Code scannen, um das PDF zu öffnen:</p>

    <div id="qrcode"></div>

    <p class="url" id="pdf-url"></p>

    <p class="url" id="warning" hidden></p>

    <p class="hint">
        Nach dem Speichern: Seite neu laden (F5), dann neuen QR-Code scannen.
        <br><br>
        <a href="index.html">Zur Zeugnisse-Seite</a>
    </p>

    <script>
        // Direktes PDF (Anzeige im Browser, kein Download) – funktioniert sofort
        const PDF_URL =
            "https://cdn.jsdelivr.net/gh/ElyasJ7/QR-Code@feature/qr-code/Zeugnisse/Pr%C3%BCfungszeugnis%20Fachinformatiker%20%28AO%202020%29%20Fachrichtung_%20Anwendungsentwicklung.pdf";

        const isLocal = window.location.protocol === "file:";
        const warningEl = document.getElementById("warning");

        if (isLocal) {
            warningEl.hidden = false;
            warningEl.style.color = "#c00";
            warningEl.textContent =
                "Hinweis: Sie haben ihk-qr.html lokal geöffnet. Der QR-Code zeigt auf die Online-URL unten – " +
                "laden Sie die Seite neu, nachdem Sie die Änderungen gespeichert haben.";
        }

        document.getElementById("pdf-url").textContent = PDF_URL;

        new QRCode(document.getElementById("qrcode"), {
            text: PDF_URL,
            width: 256,
            height: 256,
            correctLevel: QRCode.CorrectLevel.M
        });
    </script>
</body>
</html>
